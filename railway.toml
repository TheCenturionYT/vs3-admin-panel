# VS3 Admin Panel — Railway Configuration
# Build section intentionally omitted — each service sets its own Dockerfile
# in the Railway dashboard so railway.toml doesn't override them.
#
# vs3-admin-panel service: Dockerfile path = /Dockerfile
# satisfied-freedom service: Dockerfile path = /Dockerfile.pb

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Note: Environment variables are set in Railway's dashboard, not here.
# Required env vars for Railway deployment:
#   POCKETBASE_URL      — Railway private network URL of PocketBase service
#   PUBLIC_POCKETBASE_URL — Public URL of the PocketBase Railway service
#   ORIGIN              — Public URL of the SvelteKit app service (required by adapter-node)
#   NODE_ENV            — production
